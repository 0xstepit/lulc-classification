[project]
name = "lu-lc-classification-with-unet"
version = "0.1.0"
description = "Land use and land cover classification with Sentinel-2 imagery, Random Forests, and U-Net"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "dask[complete]>=2026.7.1",
  "dotenv>=0.9.9",
  "folium>=0.20.0",
  "geopandas>=1.1.3",
  "matplotlib>=3.10.9",
  "numpy>=2.4.6",
  "psutil>=7.2.2",
  "pystac>=1.14.3",
  "pystac-client>=0.9.0",
  "rasterio>=1.5.0",
  "rich>=15.0.0",
  "rioxarray>=0.22.0",
  "ruff>=0.15.14",
  "shapely>=2.1.2",
  "tenacity>=9.1.4",
  "tqdm>=4.68.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = ["D", "I"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[dependency-groups]
dev = [
  "ipywidgets>=8.1.8",
  "jupyterlab>=4.5.7",
  "jupytext>=1.19.3",
  "mdformat>=1.0.0",
  "mdformat-myst>=0.3.0",
  "pre-commit>=4.6.0",
  "pytest>=9.0.3",
]
