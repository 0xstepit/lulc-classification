[project]
name = "lulc-classification"
version = "0.1.0"
description = "Data-driven land use and land cover classification with Sentinel-2 imagery"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.53",
    "cycler>=0.12.1",
    "dask[complete]>=2026.7.1",
    "dotenv>=0.9.9",
    "geopandas>=1.1.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "psutil>=7.2.2",
    "pystac>=1.14.3",
    "pystac-client>=0.9.0",
    "rasterio>=1.5.0",
    "rich>=15.0.0",
    "rioxarray>=0.22.0",
    "scikit-learn>=1.9.0",
    "shapely>=2.1.2",
    "tenacity>=9.1.4",
    "torch>=2.13.0",
]

[tool.pytest.ini_options]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lulc"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "D",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "RET",
    "PTH",
    "LOG",
    # "G", must be renabled after cleaning
    "NPY",
    "PD",
    "ARG",
    "TID",
    "RUF",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports]
require-lazy = { include = "all" }

# Ignore all pydocstyle rules for tests.
[tool.ruff.lint.per-file-ignores]
"tests/**/*"   = ["D"]
"notebooks/**" = ["D", "E402", "F821", "T20"]

[tool.ruff.format]
docstring-code-format      = true
docstring-code-line-length = 80

[tool.pyright]
# Needed when pyright is launched outside `uv run` (an editor's language server),
# which otherwise resolves against its own interpreter and reports every
# third-party import as unresolved.
venvPath = "."
venv     = ".venv"

pythonVersion  = "3.14"
pythonPlatform = "All"

# Without an explicit `include`, pyright analyses the whole project root and
# sweeps in notebooks.
include = ["src", "tests", "scripts"]
exclude = ["**/__pycache__", "**/.ipynb_checkpoints", "notebooks", ".venv"]

typeCheckingMode = "standard"

[tool.jupytext]
formats = "ipynb,py:percent"

[dependency-groups]
dev = [
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.7",
    "jupytext>=1.19.3",
    "mdformat>=1.0.0",
    "mdformat-myst>=0.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "folium>=0.20.0",
    "ruff>=0.15.14",
    "taplo>=0.9.3",
    "geodataset>=0.3.2",
    "geodatasets>=2026.5.1",
    "dvc>=3.67.1",
    "pytest-cov>=7.1.0",
]
