[project]
name = "lu-lc-classification-with-unet"
version = "0.1.0"
description = "Land usage and land cover classification with Sentinel-2 imagery an U-Net"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "mdformat>=1.0.0",
  "pre-commit>=4.6.0",
  "pystac-client>=0.9.0",
  "pytest>=9.0.3",
  "ruff>=0.15.14",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = ["D", "I"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[dependency-groups]
dev = ["pre-commit>=4.6.0"]
