# WorldCover code -> merged class id. FINALIZE this after inspecting the
# distribution logged by scripts/03. Codes absent here become `nodata`.
mapping = { "10" = 1, "20" = 2, "30" = 3, "40" = 4, "50" = 4, "60" = 6, "70" = 7, "80" = 8, "90" = 9, "95" = 10, "100" = 10 }
# merged id -> human name (for figures / README later)
