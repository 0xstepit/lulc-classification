[aoi]
name = "andalusia" # Bounding box expressed in the EPSG: 4326.
bounding_box = [
  -6.362565950090263,
  37.00620706676072,
  -5.798434049909736,
  37.45839293323928,
]
tile = "MGRS-30STG"
size = 50_000 # [m]
year = 2022
max_cloud_coverage = 10.0
min_scenes = 30
min_scenes_per_season = 5
# longitude/latitude (x, y) points of the candidate regions.
candidates = { brandeburg = [
  13.4402,
  52.7654,
], lombardy = [
  10.0509,
  45.6435,
], andalusia = [
  -6.0805,
  37.2323,
] }

[stac]
url = "https://stac.dataspace.copernicus.eu/v1"
collection = "sentinel-2-l2a"

[msi]
# Bands are identified with the Coperinicus ID.
#
# 10: blue, green, red, NIR.
# 20: red edge 1, red edge 2, red edge 3, narrow NIR, SWIR 1, SWIR 2, SCL.
bands = { 10 = [
  "B02_10m",
  "B03_10m",
  "B04_10m",
  "B08_10m",
], 20 = [
  "B05_20m",
  "B06_20m",
  "B07_20m",
  "B8A_20m",
  "B11_20m",
  "B12_20m",
  "SCL_20m",
] }
target_resolution = 10
scl_mask_classes = [0, 1, 3, 7, 8, 9, 10, 11] # classes used to filter rasters.

[composites]
max_scenes_per_season = 10 # we could need it to limit computational resources.
seasons = { DJF = [
  "2021-12-01",
  "2022-02-28",
], MAM = [
  "2022-03-01",
  "2022-05-31",
], JJA = [
  "2022-06-01",
  "2022-08-31",
], SON = [
  "2022-09-01",
  "2022-11-30",
] }
tiles_size = 1024 # dimension of the tile window to apply for the composite.
# indices = ["NDVI", "NDBI", "NDWI"] # Computed per season

[indices]
# A map from the band name to the raster channel index for each index.
bands_to_channels = { ndvi = { "nir" = 3, "red" = 2 }, ndbi = { "swir" = 9, "nir" = 3 }, ndwi = { "green" = 1, "nir" = 3 } }

[worldcover]
url = "https://esa-worldcover.s3.eu-central-1.amazonaws.com"
grid_url = "https://esa-worldcover.s3.eu-central-1.amazonaws.com/esa_worldcover_grid.geojson"
version = "v200"
year = 2021
class_to_color = { "10" = [
